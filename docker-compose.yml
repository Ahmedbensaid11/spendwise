services:
  db:
    image: postgres:16
    container_name: spendwise-db
    environment:
      POSTGRES_DB: ${DB_NAME:-spendwise}
      POSTGRES_USER: ${DB_USER:-spendwise}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spendwise-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: 9090
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-spendwise}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-spendwise}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      JWT_SECRET: ${JWT_SECRET:-spendwise-local-development-secret-please-change}
    ports:
      - "${API_HOST_PORT:-9091}:9090"
    restart: unless-stopped

volumes:
  pgdata:
